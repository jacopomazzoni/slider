name: Code and publication checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/check_publish.py
      - run: python manage.py check
      - run: python manage.py test posts.test_updates posts.test_activity

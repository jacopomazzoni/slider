{% load navigation_tags %}
{% nav_items user as app_nav_items %}
{% for item in app_nav_items %}
  {% if item.key == 'logout' %}
  <form method="post" action="{{ item.url }}" class="nav-action">
    {% csrf_token %}
    <button type="submit" class="nav-link">
      <span class="nav-link-icon" aria-hidden="true">
        {% include "includes/nav_icon.html" with icon=item.icon %}
      </span>
      <span>{{ item.label }}</span>
    </button>
  </form>
  {% else %}
  <a href="{{ item.url }}" class="nav-link">
    <span class="nav-link-icon" aria-hidden="true">
      {% include "includes/nav_icon.html" with icon=item.icon %}
    </span>
    <span>{{ item.label }}</span>
  </a>
  {% endif %}
{% endfor %}
